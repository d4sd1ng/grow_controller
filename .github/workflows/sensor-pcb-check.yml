name: Sensor PCB KiCad DRC

on:
  push:
    branches:
      - fix/restore-serial-sensor-readings-20261114
    paths:
      - 'hardware/cad/sensor_pcb_routed_candidate.kicad_pcb'
      - '.github/workflows/sensor-pcb-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout PCB
        uses: actions/checkout@v4
      - name: Install KiCad CLI in runner
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Run KiCad board DRC
        shell: bash
        run: |
          mkdir -p pcb-drc-output
          set +e
          kicad-cli pcb drc --exit-code-violations --all-track-errors --severity-all \
            --output pcb-drc-output/sensor_drc.txt \
            hardware/cad/sensor_pcb_routed_candidate.kicad_pcb \
            > pcb-drc-output/kicad_stdout.txt 2>&1
          result=$?
          cat pcb-drc-output/kicad_stdout.txt
          if [[ -f pcb-drc-output/sensor_drc.txt ]]; then
            head -n 140 pcb-drc-output/sensor_drc.txt
          fi
          exit "$result"
      - name: Preserve DRC report, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensor-pcb-kicad-drc
          path: pcb-drc-output/
          if-no-files-found: warn

# Intentionally no Gerber/Excellon export: prototype footprints and
# unapproved mechanical geometry make manufacturing unsafe.
