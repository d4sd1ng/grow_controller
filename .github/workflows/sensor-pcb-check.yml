name: Sensor PCB KiCad DRC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sensor-pcb-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-board:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout routed sensor PCB from development branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-serial-sensor-readings-20261114
          persist-credentials: false

      - name: Install KiCad CLI
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad
          kicad-cli version

      - name: Check board exists
        run: test -f hardware/cad/sensor_pcb_routed_candidate.kicad_pcb

      - name: KiCad PCB design rule check
        shell: bash
        run: |
          mkdir -p pcb-drc-output
          set +e
          kicad-cli pcb drc \
            --exit-code-violations --all-track-errors --severity-all \
            --output pcb-drc-output/sensor_drc.txt \
            hardware/cad/sensor_pcb_routed_candidate.kicad_pcb \
            > pcb-drc-output/kicad_stdout.txt 2>&1
          result=$?
          cat pcb-drc-output/kicad_stdout.txt
          if [[ -f pcb-drc-output/sensor_drc.txt ]]; then
            head -n 120 pcb-drc-output/sensor_drc.txt
          fi
          exit "$result"

      - name: Upload DRC report even when check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensor-pcb-kicad-drc
          path: pcb-drc-output/
          if-no-files-found: warn

# This workflow intentionally does not export production Gerbers.
# Placeholder footprints and mounting geometry remain unapproved.
